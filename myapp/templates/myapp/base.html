<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Programas universitarios{% endblock %}</title>
    <style>
        :root {
            --primario: #1f4e79;
            --primario-oscuro: #163a5a;
            --fondo: #f3f5f8;
            --borde: #d6dce4;
            --texto: #1e2a36;
            --suave: #5f6b78;
            --exito: #1e7b4a;
            --error: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }
        header {
            background: var(--primario);
            color: #fff;
            padding: 16px 24px;
        }
        header .contenido {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        header h1 { margin: 0; font-size: 1.25rem; }
        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 16px;
            opacity: .9;
        }
        header nav a:hover { opacity: 1; text-decoration: underline; }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .tarjeta h2 { margin-top: 0; }
        .mensaje {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #e7f6ee;
            color: var(--exito);
            border: 1px solid #b7e2c8;
        }
        footer {
            text-align: center;
            color: var(--suave);
            font-size: .85rem;
            padding: 24px 16px;
        }
        {% block estilos %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="contenido">
            <h1>Programas universitarios</h1>
            <nav>
                <a href="{% url 'crear_programa' %}">Crear programa</a>
                <a href="{% url 'admin:index' %}">Administrador</a>
            </nav>
        </div>
    </header>

    <main>
        {% for message in messages %}
            <div class="mensaje">{{ message }}</div>
        {% endfor %}

        {% block contenido %}{% endblock %}
    </main>

    <footer>Desarrollo de Aplicaciones Web I – 4E · Parcial Final</footer>
</body>
</html>
